<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Album</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    body {
      background: #f8fafc;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .navbar {
      background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
    }
    .card {
      border: none;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      border-radius: 1rem;
    }
    .photo-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      overflow: hidden;
      border-radius: 0.75rem;
      background: #fff;
    }
    .photo-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
    }
    .photo-img {
      height: 220px;
      object-fit: cover;
      width: 100%;
    }
    .tag-badge {
      font-size: 0.75rem;
      margin-right: 4px;
      margin-bottom: 4px;
      display: inline-block;
    }
    .dropzone {
      border: 2px dashed #cbd5e1;
      border-radius: 0.75rem;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .dropzone:hover {
      border-color: #6366f1;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-dark shadow-sm py-3 mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1 fs-4 fw-bold">
        <i class="bi bi-camera-fill me-2"></i>Smart Album
      </span>
    </div>
  </nav>

  <div class="container mb-5">
    <!-- Top Action Cards -->
    <div class="row g-4 mb-4">
      
      <!-- Search Section -->
      <div class="col-lg-7">
        <div class="card h-100 p-4">
          <h5 class="card-title fw-bold text-dark mb-3">
            <i class="bi bi-search text-primary me-2"></i>Search Photos
          </h5>
          <p class="text-muted small">Search using natural language (e.g. <em>"show me photos of dogs"</em> or <em>"trees and birds"</em>).</p>
          
          <div class="input-group mb-3">
            <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="Type what you're looking for..." />
            <button class="btn btn-outline-secondary" type="button" id="micBtn" title="Voice Search (if supported)">
              <i class="bi bi-mic-fill"></i>
            </button>
            <button class="btn btn-primary px-4 fw-semibold" type="button" id="searchBtn">
              <span id="searchSpinner" class="spinner-border spinner-border-sm d-none me-1" role="status"></span>
              Search
            </button>
          </div>
          
          <div class="d-flex flex-wrap gap-2 align-items-center">
            <span class="small text-muted">Suggestions:</span>
            <button class="btn btn-sm btn-outline-primary py-0 px-2 rounded-pill suggestion-btn">dog</button>
            <button class="btn btn-sm btn-outline-primary py-0 px-2 rounded-pill suggestion-btn">cat</button>
            <button class="btn btn-sm btn-outline-primary py-0 px-2 rounded-pill suggestion-btn">tree and bird</button>
            <button class="btn btn-sm btn-outline-primary py-0 px-2 rounded-pill suggestion-btn">show me car</button>
          </div>
        </div>
      </div>

      <!-- Upload Section -->
      <div class="col-lg-5">
        <div class="card h-100 p-4">
          <h5 class="card-title fw-bold text-dark mb-3">
            <i class="bi bi-cloud-arrow-up-fill text-success me-2"></i>Upload Photo
          </h5>
          <form id="uploadForm">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Select Image (PNG / JPEG)</label>
              <input class="form-control" type="file" id="fileInput" accept="image/png, image/jpeg, image/jpg" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Custom Labels (comma separated)</label>
              <input type="text" class="form-control" id="customLabelsInput" placeholder="e.g. Sam, Sally, Vacation">
            </div>
            <button type="submit" class="btn btn-success w-100 fw-semibold" id="uploadBtn">
              <span id="uploadSpinner" class="spinner-border spinner-border-sm d-none me-1" role="status"></span>
              Upload & Index Photo
            </button>
          </form>
          <div id="uploadAlert" class="alert d-none mt-3 mb-0 py-2 small" role="alert"></div>
        </div>
      </div>

    </div>

    <!-- Results Section -->
    <div class="card p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="card-title fw-bold text-dark mb-0">
          <i class="bi bi-images text-info me-2"></i>Gallery Results
        </h5>
        <span id="resultsCount" class="badge bg-secondary">0 photos</span>
      </div>

      <div id="galleryContainer" class="row g-4">
        <div class="col-12 text-center text-muted py-5" id="placeholderMsg">
          <i class="bi bi-image fs-1 d-block mb-2 text-secondary"></i>
          Search for photos above or upload new photos to see them here!
        </div>
      </div>
    </div>
  </div>

  <!-- API Gateway SDK scripts -->
  <script src="lib/axios/dist/axios.standalone.js"></script>
  <script src="lib/CryptoJS/rollups/hmac-sha256.js"></script>
  <script src="lib/CryptoJS/rollups/sha256.js"></script>
  <script src="lib/CryptoJS/components/hmac.js"></script>
  <script src="lib/CryptoJS/components/enc-base64.js"></script>
  <script src="lib/url-template/url-template.js"></script>
  <script src="lib/apiGatewayCore/sigV4Client.js"></script>
  <script src="lib/apiGatewayCore/apiGatewayClient.js"></script>
  <script src="lib/apiGatewayCore/simpleHttpClient.js"></script>
  <script src="lib/apiGatewayCore/utils.js"></script>
  <script src="apigClient.js"></script>

  <!-- Application Logic -->
  <script src="main.js"></script>
</body>
</html>
